<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#152718"><title>悬城守卫 · 森林战线</title><meta name="description" content="在俯视森林战场上采集资源、训练士兵并守住村庄。"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="compact.css"></head><body><main class="game-shell"><section class="stage" id="stage"><canvas id="game" width="1280" height="720" aria-label="森林战场"></canvas><header class="hud"><div class="logo"><span>H</span><b>悬城守卫<small>FOREST FRONT</small></b></div><div class="resources"><div><i class="coin"></i><small>矿石</small><strong id="gold">120</strong></div><div><i class="log"></i><small>木材</small><strong id="wood">90</strong></div><div><i class="helm">⚔</i><small>剑士</small><strong id="footmen">0</strong></div><div><i class="bow">➶</i><small>弓手</small><strong id="archers">0</strong></div></div><nav class="controls" aria-label="游戏控制"><button id="pauseBtn" title="暂停">Ⅱ</button><button id="restartBtn" title="重新开始">↻</button><button id="soundBtn" title="声音">♪</button></nav></header><aside class="tools" aria-label="快捷行动"><button data-action="mine"><i>◆</i><b>采矿</b><em>+</em></button><button data-action="wood"><i>♣</i><b>伐木</b><em>+</em></button><button data-action="footman"><i>⚔</i><b>剑士</b><em>+</em></button><button data-action="archer"><i>➶</i><b>弓手</b><em>+</em></button></aside><div class="castle-life"><span>村庄城防</span><div><i id="hpBar"></i></div><b id="hp">100</b></div><div class="wave-card"><small>WAVE</small><strong><span id="wave">1</span><i>/ 8</i></strong><div class="hourglass"><span id="sand"></span></div><em id="enemies">0 敌军</em></div><div class="hover-tip" id="hoverTip">悬停地图上的矿洞、树林或村庄建筑</div><div class="modal" id="startCard"><div class="crest">H</div><p>原创俯视策略小游戏</p><h1>守住森林边境</h1><div class="rules"><span><b>01</b>悬停矿洞与树林采集</span><span><b>02</b>悬停村庄建筑训练士兵</span><span><b>03</b>悬停敌人可集中火力</span></div><button id="startBtn">开始战斗
